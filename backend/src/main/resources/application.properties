spring.application.name=backend
server.port=${PORT:8080}

# Database - use separate vars to build a proper JDBC URL (avoids JDBC driver userinfo parsing issues)
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway - schema is now managed by versioned migrations, not ddl-auto
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Speed up startup on Render free tier (slow CPU)
spring.main.lazy-initialization=true

logging.level.org.springframework.security=WARN

# App properties
app.jwt-secret=${JWT_SECRET}
app.jwt-expiration-milliseconds=604800000