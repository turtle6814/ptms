services:
  db:
    image: postgres:16-alpine
    container_name: ptms-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pickleball_tms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pickleball_tms"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ptms-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "3000:8080"

volumes:
  pgdata:
